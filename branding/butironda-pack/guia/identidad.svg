<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title"><title id="title">ButiRonda · identidad</title><rect x="0" y="0" width="1600" height="1220" rx="0" fill="#F6F0E3" stroke="none"/><text x="64" y="65" font-family="Noto Sans" font-size="15" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="2">BUTIRONDA / IDENTIDAD</text><path d="M64 92h1472" stroke="#D9CFBC"/><g transform="translate(88 171) scale(1.2123287671232876)"><g data-brand-symbol="parelles" transform="translate(0 1) scale(0.5625)"><g fill="#183D35"><rect x="58" y="24" width="108" height="56" rx="11"/><rect x="90" y="176" width="108" height="56" rx="11"/></g><g fill="#C96959"><rect x="176" y="58" width="56" height="108" rx="11"/><rect x="24" y="90" width="56" height="108" rx="11"/></g></g><text x="161" y="98" font-family="Noto Serif" font-size="79" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="-2.765">ButiRonda</text></g><text x="82" y="454" font-family="Noto Serif" font-size="39" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">Parelles</text><text x="82" y="506" font-family="Noto Sans" font-size="22" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">Cuatro cartas, dos parejas y un centro abierto.</text><text x="82" y="542" font-family="Noto Sans" font-size="22" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">El símbolo elegido conserva su geometría y sus colores.</text><path d="M64 588h1472" stroke="#D9CFBC"/><text x="80" y="650" font-family="Noto Sans" font-size="14" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="2">COLOR</text><rect x="80" y="680" width="250" height="70" rx="9" fill="#183D35" stroke="#D9CFBC"/><text x="80" y="790" font-family="Noto Sans" font-size="15" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">GREEN</text><text x="80" y="820" font-family="Noto Sans" font-size="16" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">#183D35</text><rect x="367" y="680" width="250" height="70" rx="9" fill="#F6F0E3" stroke="#D9CFBC"/><text x="367" y="790" font-family="Noto Sans" font-size="15" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">IVORY</text><text x="367" y="820" font-family="Noto Sans" font-size="16" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">#F6F0E3</text><rect x="654" y="680" width="250" height="70" rx="9" fill="#FFFAF0" stroke="#D9CFBC"/><text x="654" y="790" font-family="Noto Sans" font-size="15" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">PAPER</text><text x="654" y="820" font-family="Noto Sans" font-size="16" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">#FFFAF0</text><rect x="941" y="680" width="250" height="70" rx="9" fill="#C96959" stroke="#D9CFBC"/><text x="941" y="790" font-family="Noto Sans" font-size="15" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">CORAL</text><text x="941" y="820" font-family="Noto Sans" font-size="16" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">#C96959</text><rect x="1228" y="680" width="250" height="70" rx="9" fill="#BA8A3A" stroke="#D9CFBC"/><text x="1228" y="790" font-family="Noto Sans" font-size="15" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">GOLD</text><text x="1228" y="820" font-family="Noto Sans" font-size="16" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">#BA8A3A</text><text x="80" y="909" font-family="Noto Sans" font-size="14" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="2">TIPOGRAFÍA</text><text x="80" y="976" font-family="Noto Serif" font-size="48" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">Noto Serif Bold</text><text x="838" y="964" font-family="Noto Sans" font-size="31" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="0">Noto Sans Regular / Bold</text><text x="80" y="1025" font-family="Noto Sans" font-size="20" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">Títulos y nombre de marca.</text><text x="838" y="1017" font-family="Noto Sans" font-size="20" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">Textos, datos y llamadas a la acción.</text><path d="M64 1080h1472" stroke="#D9CFBC"/><text x="80" y="1135" font-family="Noto Sans" font-size="20" font-weight="400" fill="#183D35" text-anchor="start" letter-spacing="0">Usa el símbolo completo, sin estirarlo, recolorearlo ni alterar las cuatro cartas.</text><text x="80" y="1175" font-family="Noto Sans" font-size="18" font-weight="400" fill="#69716A" text-anchor="start" letter-spacing="0">Reserva al menos 1/4 del ancho del símbolo como espacio libre alrededor.</text></svg>
