<svg xmlns="http://www.w3.org/2000/svg" width="640" height="146" viewBox="0 0 640 146" role="img" aria-labelledby="title description"><title id="title">ButiRonda · Ronda · composición de prueba</title><desc id="description">Dos bandas de igual peso forman un contorno casi cuadrado. Sus encuentros escalonados sugieren continuidad sin recurrir a flechas. Nombre compuesto provisionalmente en Noto Serif Bold.</desc><g transform="translate(0 1) scale(0.5625)"><path fill="#183D35" d="M176 24H76C47.281 24 24 47.281 24 76V168H44V180H68V80C68 73.373 73.373 68 80 68H180V44H176Z"/><path fill="#C96959" transform="rotate(180 128 128)" d="M176 24H76C47.281 24 24 47.281 24 76V168H44V180H68V80C68 73.373 73.373 68 80 68H180V44H176Z"/></g><text x="161" y="98" font-family="Noto Serif" font-size="79" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="-2.765">ButiRonda</text></svg>
