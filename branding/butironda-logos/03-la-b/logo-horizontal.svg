<svg xmlns="http://www.w3.org/2000/svg" width="640" height="146" viewBox="0 0 640 146" role="img" aria-labelledby="title description"><title id="title">ButiRonda · La B · composición de prueba</title><desc id="description">Una B dibujada a medida, con dos lóbulos equivalentes, espacios interiores amplios y una separación central. La letra se sostiene sin una tipografía externa. Nombre compuesto provisionalmente en Noto Serif Bold.</desc><g transform="translate(0 1) scale(0.5625)"><path fill="#183D35" fill-rule="evenodd" d="M52 24H143C184 24 210 42 210 72C210 102 184 120 143 120H52ZM94 60V84H141C158 84 167 81 167 72C167 63 158 60 141 60Z"/><path fill="#C96959" fill-rule="evenodd" d="M52 136H143C184 136 210 154 210 184C210 214 184 232 143 232H52ZM94 172V196H141C158 196 167 193 167 184C167 175 158 172 141 172Z"/></g><text x="161" y="98" font-family="Noto Serif" font-size="79" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="-2.765">ButiRonda</text></svg>
