<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img" aria-labelledby="title description"><title id="title">ButiRonda — tres propuestas de logo</title><desc id="description">ButiRonda — tres propuestas de logo</desc><rect width="1800" height="1150" fill="#F6F0E3"/><text x="64" y="58" font-family="Noto Sans" font-size="15" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="3">BUTIRONDA</text><text x="1736" y="58" font-family="Noto Sans" font-size="13" font-weight="400" fill="#69716A" text-anchor="end" letter-spacing="1.5">ESTUDIO DE IDENTIDAD / 01</text><path d="M64 83H1736" stroke="#D9CFBC"/><text x="64" y="162" font-family="Noto Serif" font-size="52" font-weight="700" fill="#183D35" text-anchor="start" letter-spacing="-1.4">Tres formas de empezar la ronda.</text><text x="65" y="204" font-family="Noto Sans" font-size="19" font-weight="400" fill="#69716A" text-anchor="start" letter-spacing="0">Tres símbolos originales. Una misma paleta y una composición común para comparar.</text><rect x="64" y="250" width="536" height="723" rx="18" fill="#FFFAF0" stroke="#D9CFBC"/><text x="94" y="296" font-family="Noto Sans" font-size="17" font-weight="700" fill="#BA8A3A" text-anchor="start" letter-spacing="0">01</text><text x="570" y="296" font-family="Noto Sans" font-size="13" font-weight="700" fill="#183D35" text-anchor="end" letter-spacing="2">PARELLES</text><g transform="translate(208 330) scale(0.96875)"><g fill="#183D35"><rect x="58" y="24" width="108" height="56" rx="11"/><rect x="90" y="176" width="108" height="56" rx="11"/></g><g fill="#C96959"><rect x="176" y="58" width="56" height="108" rx="11"/><rect x="24" y="90" width="56" height="108" rx="11"/></g></g><text x="332" y="640" font-family="Noto Serif" font-size="56" font-weight="700" fill="#183D35" text-anchor="middle" letter-spacing="-1.9600000000000002">ButiRonda</text><text x="332" y="678" font-family="Noto Sans" font-size="12" font-weight="400" fill="#